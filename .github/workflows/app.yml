name: App
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      # 실제 앱 번들이 만들어지는지 확인 (네이티브 빌드는 EAS에서)
      - run: npx expo export --platform android --output-dir /tmp/export-android
      - run: npx expo export --platform ios --output-dir /tmp/export-ios
