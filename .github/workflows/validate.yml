name: Validate app
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market_test_only
          POSTGRES_DB: market_insight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d market_insight_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: server
        run: npm install
      - working-directory: server
        run: npm run typecheck
      - working-directory: server
        run: npm test
      - working-directory: server
        run: npm run test:api
        env:
          DATABASE_URL: postgresql://market:market_test_only@localhost:5432/market_insight_test
          AUTH_SECRET: ci-only-integration-secret-at-least-32-characters
          NODE_ENV: test
