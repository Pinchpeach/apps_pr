services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market_dev_only
      POSTGRES_DB: market_insight
    ports:
      - "5432:5432"
    volumes:
      - market_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U market -d market_insight"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  market_pg:
